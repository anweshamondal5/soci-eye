services:
  # FastAPI Backend Web Service
  - type: web
    name: soci-eye-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MAX_VIDEOS
        value: "5"
      - key: MAX_COMMENTS_PER_VIDEO
        value: "20"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # React Vite Frontend Static Site
  - type: web
    name: soci-eye-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: soci-eye-backend
          property: host
