services:
  # 1. FastAPI Backend Python Web Service (Free Tier)
  - type: web
    name: soci-eye-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MAX_VIDEOS
        value: "5"
      - key: MAX_COMMENTS_PER_VIDEO
        value: "20"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # 2. React + Vite Frontend Static Site (Free Global CDN)
  - type: web
    name: soci-eye-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: soci-eye-backend
          property: host
